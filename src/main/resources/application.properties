# Application name used in logs and Spring Boot Admin.
spring.application.name=crudSpringBootDemo

# MySQL database connection details.
# HikariCP connection pool is auto-configured by Spring Boot.
spring.datasource.url = jdbc:mysql://localhost:3306/student_crud_db
spring.datasource.username = root
spring.datasource.password = root

# Hibernate DDL auto: creates/updates tables based on @Entity classes on startup.
# Options: none, update, create, create-drop.
spring.jpa.hibernate.ddl-auto=update

# Logging: show executed SQL queries in the console (integrated with logging framework).
logging.level.org.hibernate.SQL=DEBUG

# Shows the actual values bound to ? placeholders in SQL queries (Hibernate 6.x/7.x).
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Logging: format SQL queries for better readability.
spring.jpa.properties.hibernate.format_sql=true

# Optional: also shows SQL comments with parameter metadata
spring.jpa.properties.hibernate.use_sql_comments=true